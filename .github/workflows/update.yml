# GitHub에 올려두면 6시간마다 자동으로 데이터를 갱신하고 GitHub Pages(웹앱)로 배포합니다.
# 설정: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택
name: update-callsign-data

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 (ADS-B 기종 관측을 여러 시간대에 걸쳐 누적)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: ["web/**", "config/**", "updater/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: callsign-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python updater/update.py
      - name: 공항버스 시간표 갱신 (출퇴근 탭)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python updater/bus.py || true
      - name: 공항행 정류장별 시간표 갱신 (운영사 홈페이지 7일마다 · TAGO 고속/시외 매일)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python updater/busgo.py || true
      - name: 공항행 시간표 재확인 알림 (경기공항리무진·경기고속/대원고속 — 바뀐 것 같으면 이슈로 알림)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/stale.txt || true
          import json
          s = json.load(open("web/busgo.json")).get("stale", {})
          nm = {"ggairport": "경기공항리무진", "kd": "경기고속·대원고속"}
          print("; ".join("%s %s" % (nm.get(k, k), ", ".join(v)) for k, v in s.items() if v))
          PY
          S=$(cat /tmp/stale.txt)
          if [ -n "$S" ]; then
            OPEN=$(gh issue list --label busgo-recheck --state open --json number -q '.[].number' 2>/dev/null || true)
            if [ -z "$OPEN" ]; then
              gh label create busgo-recheck --color FBCA04 --description "공항행 시간표 재확인" --force || true
              gh issue create --label busgo-recheck --title "공항행 시간표 재확인 필요: $S" --body "자동 점검에서 운영사 시간표가 바뀌었을 수 있는 노선이 나왔습니다: $S

          - 경기공항리무진: 인천공항 공공데이터의 운행 정보(공항 출발 시각·첫차/막차·정류장)가 기준과 다름
          - 경기고속·대원고속: 버스피아 홈페이지의 시간표 이미지가 바뀜

          할 일: Claude 에게 '공항행 시간표 다시 확인해줘' 라고 말하면 새 시간표를 읽어 data/busgo_ggairport.json · data/busgo_kd.json 을 고칩니다. 확인 전까지 앱에는 '재확인 중' 표시와 이전 시간표가 나옵니다. 처리 후 이 이슈를 닫아 주세요." || true
            fi
          fi
      - name: 공항버스 정류장 ID 갱신 (7일마다)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python updater/busstops.py || true
      - name: 변경사항 커밋
        run: |
          git config user.name "callsign-bot"
          git config user.email "callsign-bot@users.noreply.github.com"
          git add data web/data.json web/data.js web/bus.json web/busstops.json web/busgo.json 2>/dev/null || git add data web/data.json web/data.js
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
      - name: 기상(METAR/TAF) 수집
        run: python updater/wx.py || true
      - name: 환율 수집 (수출입은행 + er-api)
        env:
          EXIM_KEY: ${{ secrets.EXIM_KEY }}
        run: python updater/fx.py || true
      - name: 공항 도시 7일 날씨 (Open-Meteo, 6시간마다 새로 받음)
        run: python updater/fcst.py || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
